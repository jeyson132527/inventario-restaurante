<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Productos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>
            <i class="bi bi-box-seam"></i>
            Productos
        </h2>

        <a th:href="@{/productos/nuevo}" class="btn btn-success">

            <i class="bi bi-plus-circle"></i>

            Nuevo Producto

        </a>

    </div>

    <!-- Buscador -->

    <form method="get"
          th:action="@{/productos}"
          class="row mb-3">

        <div class="col-md-6">

            <input
                    type="text"
                    name="buscar"
                    class="form-control"
                    placeholder="Buscar producto..."
                    th:value="${buscar}">

        </div>

        <div class="col-md-2">

            <button class="btn btn-primary w-100">

                <i class="bi bi-search"></i>

                Buscar

            </button>

        </div>

        <div class="col-md-2">

            <a th:href="@{/productos}"
               class="btn btn-secondary w-100">

                Limpiar

            </a>

        </div>

    </form>

    <table class="table table-bordered table-hover table-striped shadow">

        <thead class="table-success">

        <tr>

            <th>ID</th>
            <th>Código</th>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Unidad</th>
            <th>Stock</th>
            <th>Estado</th>
            <th width="170">Acciones</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="p : ${productos}">

            <td th:text="${p.id}"></td>

            <td th:text="${p.codigo}"></td>

            <td th:text="${p.nombre}"></td>

            <td th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}"></td>

            <td th:text="${p.unidadMedida}"></td>

            <td th:text="${#numbers.formatDecimal(kardexService.obtenerStockProducto(p.id),1,2)}"></td>

            <td>

                <span th:if="${p.activo}" class="badge bg-success">

                    Activo

                </span>

                <span th:unless="${p.activo}" class="badge bg-danger">

                    Inactivo

                </span>

            </td>

            <td>

                <a th:href="@{/productos/editar/{id}(id=${p.id})}"
                   class="btn btn-warning btn-sm">

                    <i class="bi bi-pencil"></i>

                </a>

                <a th:href="@{/productos/eliminar/{id}(id=${p.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Desea eliminar este producto?')">

                    <i class="bi bi-trash"></i>

                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <a th:href="@{/}" class="btn btn-secondary">

        <i class="bi bi-arrow-left"></i>

        Regresar al Dashboard

    </a>

</div>

</body>

</html>
