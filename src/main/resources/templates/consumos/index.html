<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <title>Consumos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3 class="mb-0">

                    <i class="bi bi-arrow-left-right"></i>

                    Consumos

                </h3>

                <a th:href="@{/consumos/nuevo}" class="btn btn-light">

                    <i class="bi bi-plus-circle"></i>

                    Nuevo Consumo

                </a>

            </div>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">

                <tr>

                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Motivo</th>
                    <th width="120">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="consumo : ${consumos}">

                    <td th:text="${#temporals.format(consumo.fecha,'dd/MM/yyyy')}"></td>

                    <td th:text="${consumo.producto.nombre}"></td>

                    <td th:text="${consumo.cantidad}"></td>

                    <td th:text="${consumo.motivo}"></td>

                    <td>

                        <a th:href="@{/consumos/eliminar/{id}(id=${consumo.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Desea eliminar este consumo?');">

                            <i class="bi bi-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <div class="mt-3">

                <a th:href="@{/}" class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Regresar al Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
