<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>

    <title>Compras</title>

</head>

<body>

<div layout:fragment="contenido">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3 class="mb-0">

                    <i class="bi bi-cart-plus"></i>

                    Compras

                </h3>

                <a th:href="@{/compras/nuevo}"
                   class="btn btn-light">

                    <i class="bi bi-plus-circle"></i>

                    Nueva Compra

                </a>

            </div>

        </div>

        <div class="card-body">

            <!-- BUSCADOR -->

            <form th:action="@{/compras}"
                  method="get"
                  class="row mb-4">

                <div class="col-md-6">

                    <div class="input-group">

                        <input
                                type="text"
                                class="form-control"
                                name="buscar"
                                th:value="${buscar}"
                                placeholder="Buscar por producto...">

                        <button class="btn btn-success">

                            <i class="bi bi-search"></i>

                        </button>

                    </div>

                </div>

            </form>

            <!-- TABLA -->

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">

                <tr>

                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Total</th>
                    <th width="120">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="compra : ${compras}">

                    <td th:text="${#temporals.format(compra.fecha,'dd/MM/yyyy')}"></td>

                    <td th:text="${compra.producto.nombre}"></td>

                    <td th:text="${compra.cantidad}"></td>

                    <td th:text="${'$ ' + #numbers.formatDecimal(compra.precioUnitario,1,2)}"></td>

                    <td th:text="${'$ ' + #numbers.formatDecimal(compra.total,1,2)}"></td>

                    <td>

                        <!-- EDITAR -->

                        <a th:href="@{/compras/editar/{id}(id=${compra.id})}"
                           class="btn btn-warning btn-sm">

                            <i class="bi bi-pencil-square"></i>

                        </a>

                        <!-- ELIMINAR -->

                        <a th:href="@{/compras/eliminar/{id}(id=${compra.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('¿Desea eliminar esta compra?')">

                            <i class="bi bi-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <div class="mt-3">

                <a th:href="@{/}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Regresar al Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
