<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <title>Compras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3 class="mb-0">

                    <i class="bi bi-cart-plus"></i>

                    Compras

                </h3>

                <a th:href="@{/compras/nuevo}" class="btn btn-light">

                    <i class="bi bi-plus-circle"></i>

                    Nueva Compra

                </a>

            </div>

        </div>

        <div class="card-body">

            <form th:action="@{/compras}" method="get" class="row g-2 mb-3">

    <div class="col-md-10">

        <input type="text"
               name="buscar"
               class="form-control"
               placeholder="Buscar por producto..."
               th:value="${buscar}">

    </div>

    <div class="col-md-2 d-grid">

        <button class="btn btn-primary">

            <i class="bi bi-search"></i>

            Buscar

        </button>

    </div>

</form>

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-dark">

                <tr>

                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio Unitario</th>
                    <th>Total</th>
                    <th width="120">Acciones</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="compra : ${compras}">

                    <td th:text="${#temporals.format(compra.fecha,'dd/MM/yyyy')}"></td>

                    <td th:text="${compra.producto.nombre}"></td>

                    <td th:text="${compra.cantidad}"></td>

                    <td th:text="${'$ ' + #numbers.formatDecimal(compra.precioUnitario,1,2)}"></td>

                    <td th:text="${'$ ' + #numbers.formatDecimal(compra.total,1,2)}"></td>

                    <td>

                        <a th:href="@{/compras/editar/{id}(id=${compra.id})}"
                        class="btn btn-warning btn-sm">

                            <i class="bi bi-pencil-square"></i>

                        </a>

                        <a th:href="@{/compras/eliminar/{id}(id=${compra.id})}"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('¿Desea eliminar esta compra?');">

                            <i class="bi bi-trash"></i>

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

            <div class="mt-3">

                <a th:href="@{/}" class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Regresar al Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
