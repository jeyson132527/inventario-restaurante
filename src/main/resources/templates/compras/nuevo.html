<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <title>Nueva Compra</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">

                <i class="bi bi-cart-plus"></i>

                Nueva Compra

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/compras/guardar}"
                  th:object="${compra}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">

                    <label class="form-label">

                        Fecha

                    </label>

                    <input type="date"
                           class="form-control"
                           th:field="*{fecha}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Producto

                    </label>

                    <div class="input-group">

                        <select id="productoCompra"
                                class="form-select"
                                th:field="*{producto}"
                                required>

                            <option value="">Seleccione...</option>

                            <option th:each="producto : ${productos}"
                                    th:value="${producto.id}"
                                    th:text="${producto.nombre}">
                            </option>

                        </select>

                        <button type="button"
                            id="btnNuevoProducto"
                            class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#modalProducto">

                          <i class="bi bi-plus-circle"></i>

                               Nuevo Producto

                        </button>   

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Cantidad

                    </label>

                    <input type="number"
                           step="0.01"
                           min="0.01"
                           class="form-control"
                           th:field="*{cantidad}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Precio Unitario

                    </label>

                    <input type="number"
                           step="0.01"
                           min="0.01"
                           class="form-control"
                           th:field="*{precioUnitario}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Observación

                    </label>

                    <textarea class="form-control"
                              rows="3"
                              th:field="*{observacion}"
                              placeholder="Observaciones de la compra..."></textarea>

                </div>

                <div class="d-flex gap-2">

                    <button class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Guardar Compra

                    </button>

                    <a th:href="@{/compras}"
                       class="btn btn-secondary">

                        <i class="bi bi-x-circle"></i>

                        Cancelar

                    </a>

                    <a th:href="@{/}"
                       class="btn btn-dark">

                        <i class="bi bi-house-door"></i>

                        Dashboard

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- MODAL NUEVO PRODUCTO -->
<!-- ========================= -->

<div class="modal fade"
     id="modalProducto"
     tabindex="-1"
     aria-labelledby="modalProductoLabel"
     aria-hidden="true">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title"
                    id="modalProductoLabel">

                    <i class="bi bi-box-seam"></i>

                    Nuevo Producto

                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="formProducto">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Código

                            </label>

                            <input type="text"
                                   id="codigo"
                                   class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Nombre

                            </label>

                            <input type="text"
                                   id="nombre"
                                   class="form-control">

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Categoría

                            </label>

                            <select id="categoria"
                                    class="form-select">

                                <option>

                                    Seleccione...

                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Unidad de Medida

                            </label>

                            <input type="text"
                                   id="unidad"
                                   class="form-control">

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">

                                Stock Mínimo

                            </label>

                            <input type="number"
                                   step="0.01"
                                   id="stockMinimo"
                                   class="form-control">

                        </div>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button type="button"
                        id="btnGuardarProducto"
                        class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Guardar Producto

                </button>

            </div>

        </div>

    </div>

</div>

<script>
  
document.getElementById("btnNuevoProducto").addEventListener("click", function () {

    fetch("/categorias/listar-json")

        .then(response => response.json())

        .then(categorias => {

            const comboCategoria = document.getElementById("categoria");

            comboCategoria.innerHTML = "";

            const opcion = document.createElement("option");

            opcion.value = "";

            opcion.text = "Seleccione...";

            comboCategoria.appendChild(opcion);

            categorias.forEach(function(categoria){

                const option = document.createElement("option");

                option.value = categoria.id;

                option.text = categoria.nombre;

                comboCategoria.appendChild(option);

            });

        });

});

document.getElementById("btnGuardarProducto").addEventListener("click", function () {

    const datos = new URLSearchParams();

    datos.append("codigo", document.getElementById("codigo").value);
    datos.append("nombre", document.getElementById("nombre").value);
    datos.append("unidadMedida", document.getElementById("unidad").value);
    datos.append("stockMinimo", document.getElementById("stockMinimo").value);
    datos.append("categoria.id", document.getElementById("categoria").value);
    datos.append("activo", true);

    fetch("/productos/guardar-modal", {

        method: "POST",

        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },

        body: datos

    })

    .then(response => response.json())

    .then(data => {

    const combo = document.getElementById("productoCompra");

    fetch("/productos/listar-json")

        .then(response => response.json())

        .then(productos => {

            combo.innerHTML = "";

            const opcion = document.createElement("option");

            opcion.value = "";

            opcion.text = "Seleccione...";

            combo.appendChild(opcion);

            productos.forEach(function(producto){

                const option = document.createElement("option");

                option.value = producto.id;

                option.text = producto.nombre;

                combo.appendChild(option);

            });

            combo.value = data.id;

            document.getElementById("formProducto").reset();

            bootstrap.Modal.getInstance(
                document.getElementById("modalProducto")
            ).hide();

        });

})

    .catch(error => {

        alert("Error al guardar el producto.");

        console.error(error);

    });

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
