<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Inventario Actual</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <div class="d-flex justify-content-between align-items-center">

                <h3 class="mb-0">

                    <i class="bi bi-box-seam"></i>

                    Inventario Actual

                </h3>

                <a th:href="@{/}" class="btn btn-light">

                    <i class="bi bi-house-door"></i>

                    Dashboard

                </a>

            </div>

        </div>

        <div class="card-body">

            <!-- BOTONES -->

            <div class="d-flex justify-content-between mb-4">

                <div>

                    <a th:href="@{/inventario/excel}"
                       class="btn btn-success">

                        <i class="bi bi-file-earmark-excel"></i>

                        Exportar Excel

                    </a>

                    <a th:href="@{/inventario/pdf}"
                     class="btn btn-danger">

                     <i class="bi bi-file-earmark-pdf"></i>

                        Exportar PDF

                    </a>

                </div>

                <input
                        type="text"
                        id="buscar"
                        class="form-control w-25"
                        placeholder="Buscar producto...">

            </div>

            <table class="table table-hover table-bordered align-middle"
                   id="tablaInventario">

                <thead class="table-primary">

                <tr>

                    <th>Código</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Unidad</th>
                    <th class="text-center">Stock</th>
                    <th class="text-center">Stock Mínimo</th>
                    <th class="text-center">Estado</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="p : ${productos}"
                    th:classappend="${kardexService.obtenerStockProducto(p.id) < p.stockMinimo} ? 'table-danger'">

                    <td th:text="${p.codigo}"></td>

                    <td th:text="${p.nombre}"></td>

                    <td th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}"></td>

                    <td th:text="${p.unidadMedida}"></td>

                    <td class="text-center fw-bold"
                        th:text="${#numbers.formatDecimal(kardexService.obtenerStockProducto(p.id),1,2)}">
                    </td>

                    <td class="text-center"
                        th:text="${#numbers.formatDecimal(p.stockMinimo,1,2)}">
                    </td>

                    <td class="text-center">

                        <span class="badge bg-success"
                              th:if="${kardexService.obtenerStockProducto(p.id) > p.stockMinimo}">

                            Disponible

                        </span>

                        <span class="badge bg-warning text-dark"
                              th:if="${kardexService.obtenerStockProducto(p.id) == p.stockMinimo}">

                            Stock Mínimo

                        </span>

                        <span class="badge bg-danger"
                              th:if="${kardexService.obtenerStockProducto(p.id) < p.stockMinimo}">

                            Stock Bajo

                        </span>

                    </td>

                </tr>

                </tbody>

            </table>

            <div class="mt-3">

                <a th:href="@{/}"
                   class="btn btn-secondary">

                    <i class="bi bi-arrow-left"></i>

                    Regresar al Dashboard

                </a>

            </div>

        </div>

    </div>

</div>

<script>

const buscar = document.getElementById("buscar");

buscar.addEventListener("keyup", function(){

    let filtro = buscar.value.toLowerCase();

    let filas = document.querySelectorAll("#tablaInventario tbody tr");

    filas.forEach(fila=>{

        let texto = fila.innerText.toLowerCase();

        fila.style.display = texto.includes(filtro) ? "" : "none";

    });

});

</script>

</body>

</html>
