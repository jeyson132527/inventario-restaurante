<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title layout:title-pattern="$CONTENT_TITLE - Sistema Inventario">
        Sistema Inventario
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">

    <div class="container-fluid">

        <span class="navbar-brand">

            🍽 Sistema de Inventario

        </span>

        <div class="d-flex align-items-center gap-3">

    <div class="text-end text-white">

        <strong th:text="${session.nombre}"></strong>

        <br>

        <small th:text="${session.rol}"></small>

    </div>

    <a th:href="@{/logout}"
       class="btn btn-outline-light btn-sm">

        <i class="bi bi-box-arrow-right"></i>

        Salir

    </a>

</div>

    </div>

</nav>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 sidebar">

            <div class="list-group list-group-flush mt-3">

                <a href="/" class="list-group-item list-group-item-action">
                    <i class="bi bi-speedometer2"></i>
                    Dashboard
                </a>

                <a href="/inventario" class="list-group-item list-group-item-action">
                    <i class="bi bi-boxes"></i>
                    Inventario
                </a>

                <a href="/productos" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-seam"></i>
                    Productos
                </a>

                <a href="/categorias" class="list-group-item list-group-item-action">
                    <i class="bi bi-tags"></i>
                    Categorías
                </a>

                <a href="/compras" class="list-group-item list-group-item-action">
                    <i class="bi bi-cart-plus"></i>
                    Compras
                </a>

                <a href="/consumos" class="list-group-item list-group-item-action">
                    <i class="bi bi-arrow-left-right"></i>
                    Consumos
                </a>

                <a href="/kardex" class="list-group-item list-group-item-action">
                    <i class="bi bi-journal-text"></i>
                    Kardex
                </a>
                
                <a href="/usuarios" class="list-group-item list-group-item-action">

                    <i class="bi bi-people-fill"></i>

                    Usuarios

                </a>

                <a href="#" class="list-group-item list-group-item-action disabled">
                    <i class="bi bi-file-earmark-pdf"></i>
                    Reportes
                </a>

                <a href="#" class="list-group-item list-group-item-action disabled">
                    <i class="bi bi-gear"></i>
                    Configuración
                </a>

            </div>

        </div>

        <div class="col-md-10 p-4">

            <div layout:fragment="contenido">

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
