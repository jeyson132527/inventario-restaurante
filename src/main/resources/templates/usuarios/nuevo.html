<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">

<head>
    <title>Usuario</title>
</head>

<body>

<div layout:fragment="contenido">

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h3>

                <i class="bi bi-person-plus-fill"></i>

                Usuario

            </h3>

        </div>

        <div class="card-body">

            <form th:action="@{/usuarios/guardar}"
                  method="post">

                <input type="hidden"
                       name="id"
                       th:value="${usuario != null ? usuario.id : ''}">

                <div class="mb-3">

                    <label class="form-label">

                        Nombre

                    </label>

                    <input
                            type="text"
                            class="form-control"
                            name="nombre"
                            th:value="${usuario != null ? usuario.nombre : ''}"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Usuario

                    </label>

                    <input
                            type="text"
                            class="form-control"
                            name="usuario"
                            th:value="${usuario != null ? usuario.usuario : ''}"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Contraseña

                    </label>

                    <input
                            type="password"
                            class="form-control"
                            name="password"
                            th:value="${usuario != null ? usuario.password : ''}"
                            required>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Rol

                    </label>

                    <select
                            class="form-select"
                            name="rol">

                        <option value="ADMIN"
                                th:selected="${usuario != null and usuario.rol == 'ADMIN'}">

                            Administrador

                        </option>

                        <option value="OPERADOR"
                                th:selected="${usuario != null and usuario.rol == 'OPERADOR'}">

                            Operador

                        </option>

                    </select>

                </div>

                <div class="form-check mb-4">

                    <input
                            class="form-check-input"
                            type="checkbox"
                            name="activo"
                            value="true"
                            th:checked="${usuario != null and usuario.activo}">

                    <label class="form-check-label">

                        Usuario activo

                    </label>

                </div>

                <button class="btn btn-success">

                    <i class="bi bi-check-circle"></i>

                    Guardar

                </button>

                <a th:href="@{/usuarios}"
                   class="btn btn-secondary">

                    Cancelar

                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
