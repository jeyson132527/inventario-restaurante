<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">
    <title>Categorías</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">

        <h2>Categorías</h2>

        <a th:href="@{/categorias/nuevo}" class="btn btn-success">
            Nueva Categoría
        </a>

    </div>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Activo</th>
            <th>Acciones</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="c : ${categorias}">

            <td th:text="${c.id}"></td>

            <td th:text="${c.nombre}"></td>

            <td th:text="${c.descripcion}"></td>

            <td th:text="${c.activo ? 'Sí' : 'No'}"></td>

            <td>

                <a th:href="@{/categorias/editar/{id}(id=${c.id})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:href="@{/categorias/eliminar/{id}(id=${c.id})}"
                   class="btn btn-danger btn-sm">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
